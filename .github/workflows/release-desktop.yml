name: Release desktop app

# The version rule: `version` in apps/desktop/package.json is the desktop app's version, and the
# tag is `v` followed by it. The step below refuses a tag that disagrees, because an installer
# carrying a version nobody asked for is not something a reader of the release page can spot.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach the artifacts to
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `--include=dev` because a shell that sets NODE_ENV=production would otherwise leave this
      # job without a test runner or a type checker, and the failure would look like a broken
      # repository rather than a missing install.
      - name: Install dependencies
        run: npm ci --include=dev

      # Electron 44 has no postinstall: `npm ci` installs the package and deliberately not the
      # binary, which arrives the first time something requires it. Both the smoke test, which
      # reads the path file directly, and electron-builder, which is pointed at the installed
      # distribution, need it to exist before either runs. This is the one place that says so.
      - name: Download the Electron distribution
        run: node node_modules/electron/install.js

      - name: Check the tag names the desktop app version
        run: node scripts/check-release-version.mjs
        env:
          TWIGRAPH_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      # The project's definition of green, and the gate that has to pass before anything is built.
      - name: Typecheck, lint, and test with coverage
        run: npm run verify

      # A real Electron process, driven through a real page: the renderer's content security
      # policy, the sandboxed preload and the answer ledger, none of which `npm run verify` can
      # reach.
      #
      # Advisory, deliberately. This is the one step whose result depends on the machine rather
      # than on the code: the desktop it is given, whether a compositor hands over a frame, and
      # how a synthetic click lands on a panel in that particular window. It has been seen to
      # fail on a runner with nothing wrong in the app, and a release should not be held up by a
      # window that would not paint. The gate for the installer is `npm run package:desktop`
      # followed by the check below, which reads the archive that would actually be downloaded.
      - name: Drive the window in a real Electron process (advisory)
        continue-on-error: true
        run: |
          npm run build:desktop
          $env:TWIGRAPH_DESKTOP_SMOKE = '1'
          npx vitest run apps/desktop/tests/desktop.smoke.test.ts --no-coverage

      - name: Package the installer and the portable zip
        run: npm run package:desktop

      # Runs the packaged application, and reads the archive it just produced rather than
      # trusting the packaging step to have included the page.
      - name: Check the packaged build
        run: |
          $env:TWIGRAPH_DESKTOP_PACKAGED = '1'
          npx vitest run apps/desktop/tests/packaged.test.ts --no-coverage

      - name: Write SHA256 checksums
        run: |
          $release = (Resolve-Path apps/desktop/release).Path
          Get-ChildItem -Path $release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } |
            Set-Content -Path (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii

      # A draft, so the release notes can be edited and the artifacts downloaded and opened
      # before anyone else can find them. Publishing is a deliberate click, never a side effect
      # of pushing a tag.
      - name: Upload a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/release/*-setup.exe
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
